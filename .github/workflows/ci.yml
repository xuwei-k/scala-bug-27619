on:
  push:
  pull_request:
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - scala: 3.10.1
          - scala: 3.10.0
    runs-on: ubuntu-latest
    steps:
    - uses: actions/setup-java@v6
      with:
        java-version: 21
        distribution: zulu
    - uses: actions/checkout@v7
    - uses: sbt/setup-sbt@v1
    - run: sbt -v "++ ${{ matrix.scala }}!" compile app/run
